services:
  - type: web
    name: salespilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Account individuali e archivio permanente (consigliato)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Facoltativa: indirizzo pubblico dell'app, per il ritorno dal link di conferma email
      - key: APP_URL
        sync: false
      # Informativa privacy: titolare e contatto (consigliate)
      - key: PRIVACY_CONTROLLER
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Alternativa senza Supabase: accesso con credenziali condivise
      - key: SALESPILOT_USERNAME
        sync: false
      - key: SALESPILOT_PASSWORD
        sync: false
